<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e2a4a">
<title>Family Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1e2a4a; --navy2:#2b3a63; --bg:#f5f3ee; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --line:#e7e3da; --accent:#ff7a45; --good:#22c55e; --gold:#fbbf24;
  --fun:'Fredoka','Nunito',system-ui,Roboto,sans-serif; --body:'Nunito',system-ui,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
input,select,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}

/* ---------- Header ---------- */
#top{height:76px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;position:relative;z-index:5}
.clock{min-width:190px}
#clkTime{font-family:var(--fun);font-size:30px;font-weight:600;line-height:1}
#clkDate{font-size:14px;opacity:.75;margin-top:4px}
#tabs{flex:1;display:flex;justify-content:center}
#tabs button{font-family:var(--fun);font-size:20px;font-weight:500;padding:12px 26px;border-radius:40px;margin:0 6px;color:#cdd5ee}
#tabs button.on{background:#fff;color:var(--navy)}
.gstat{font-size:22px;width:44px;height:44px;border-radius:50%;background:transparent;margin-right:6px}
.gstat.bad{background:#fee2e2}
.gbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin:10px 0}
.gbox code{word-break:break-all;font-size:13px}
.gear{font-size:26px;width:54px;height:54px;border-radius:50%;background:var(--navy2)}
#main{position:absolute;top:76px;left:0;right:0;bottom:0;overflow:hidden}

/* ---------- Shared ---------- */
.btn{font-weight:700;font-size:16px;padding:12px 20px;border-radius:14px;background:#eef0f5;color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}
.btn.dark{background:var(--navy);color:#fff}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:16px}
.empty .big{font-size:44px;display:block;margin-bottom:6px}

/* ---------- Calendar ---------- */
.cal{height:100%;display:flex;flex-direction:column;padding:14px 18px 16px}
.toolbar{display:flex;align-items:center;margin-bottom:12px}
.toolbar>*+*{margin-left:10px}
.navbtn{width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px;font-weight:700}
.calTitle{font-family:var(--fun);font-size:26px;font-weight:600;min-width:250px;margin-left:14px!important}
.seg{display:flex;background:#e9e5dc;border-radius:14px;padding:4px;margin-left:auto!important}
.seg button{padding:10px 18px;border-radius:10px;font-weight:700;font-size:15px;color:#555}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.calBody{flex:1;min-height:0;display:flex}
.chip{display:block;width:100%;text-align:left;background:#fff;border-left:5px solid #94a3b8;border-radius:8px;padding:4px 7px;
  font-size:13px;line-height:1.25;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip b{font-weight:800;margin-right:4px}
/* month */
.month{flex:1;display:flex;flex-direction:column;min-width:0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-weight:800;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 2px 6px}
.dow div{padding-left:8px}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);gap:5px;min-height:0}
.mcell{background:#fff;border-radius:12px;padding:6px;overflow:hidden;text-align:left;border:2px solid transparent;display:flex;flex-direction:column;min-height:0}
.mcell .n{font-weight:800;font-size:15px;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%}
.mcell.other{background:#f0ede6;opacity:.6}
.mcell.today .n{background:var(--accent);color:#fff}
.mcell.sel{border-color:var(--navy)}
.mcell .chip{font-size:12px;padding:2px 5px;margin-top:3px;background:#f7f7f9;border-left-width:4px;box-shadow:none}
.mcell .more{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;padding-left:4px}
.side{width:330px;margin-left:16px;background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:0}
.side h3{font-family:var(--fun);font-weight:600;font-size:21px;margin:0}
.side .sub{color:var(--muted);font-size:14px;margin:2px 0 10px}
.side .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ecard{display:flex;width:100%;text-align:left;background:#f8f7f4;border-radius:14px;padding:12px;margin-bottom:8px;border-left:6px solid #94a3b8}
.ecard .t{width:72px;font-weight:800;font-size:14px;flex-shrink:0;color:#374151}
.ecard .ti{font-weight:800;font-size:16px}
.ecard .who{font-size:13px;color:var(--muted);margin-top:2px}
.chip.bday,.ecard.bday{background:linear-gradient(90deg,#fff0f6,#fff7d6)!important;border-left-color:#ec4899!important}
.mcell.hasbday{background:linear-gradient(160deg,#fff0f6,#fffbea)}
.mcell{position:relative}
.mcell .cake{position:absolute;top:6px;right:8px;font-size:20px;line-height:28px;animation:wob 2.4s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
.ecard.bday .t{font-size:30px;line-height:1}
.bdaybanner{border-radius:16px;padding:12px 14px;margin-bottom:10px;font-family:var(--fun);font-weight:600;font-size:19px;color:#9d174d;
  background:linear-gradient(90deg,#fce7f3,#fef3c7);text-align:center;animation:pop .6s}
.bdaybanner .big{font-size:34px;display:block}
.kindrow{display:flex;margin-bottom:14px}
.kindrow button{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);font-weight:800;font-size:16px;background:#fff}
.kindrow button+button{margin-left:10px}
.kindrow button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.kindrow button.on.b{border-color:#ec4899;background:linear-gradient(90deg,#ec4899,#f59e0b)}
/* week */
.week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-height:0}
.wcol{background:#fff;border-radius:14px;padding:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.wcol.today{box-shadow:inset 0 0 0 3px var(--accent)}
.whead{text-align:center;padding:4px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px;width:100%}
.whead .d{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase}
.whead .n{font-family:var(--fun);font-size:26px;font-weight:600}
.wcol .list{flex:1;overflow-y:auto}
.wcol .chip{white-space:normal;font-size:13px;padding:6px 7px;background:#f8f7f4;box-shadow:none}
.wadd{width:100%;padding:8px;color:#9ca3af;font-size:22px;font-weight:700}
/* day / upcoming */
.dayv{flex:1;overflow-y:auto;background:#fff;border-radius:18px;padding:18px 22px}
.dayv .ecard{padding:16px}
.dayv .ecard .ti{font-size:19px}
.dayv .ecard .t{width:96px;font-size:16px}
.ugroup{margin-bottom:14px}
.ugroup h4{margin:0 0 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ugroup h4 span{color:var(--accent)}

/* ---------- Chores ---------- */
.chores{height:100%;overflow:auto;padding:16px;background:
  radial-gradient(circle at 10% 10%,#ffe8d6 0,transparent 40%),radial-gradient(circle at 90% 20%,#e0e7ff 0,transparent 40%),
  radial-gradient(circle at 50% 100%,#dcfce7 0,transparent 45%),#fffaf3}
.kids{display:grid;gap:16px;min-height:100%}
.kid{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 6px 20px rgba(30,42,74,.10);display:flex;flex-direction:column}
.khead{padding:16px 18px;color:#fff;display:flex;align-items:center;position:relative}
.avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.28);font-size:38px;line-height:64px;text-align:center;flex-shrink:0}
.kname{font-family:var(--fun);font-size:30px;font-weight:600;margin-left:14px;line-height:1}
.ksub{font-size:15px;opacity:.92;margin-top:6px;font-weight:700}
.kstars{margin-left:auto;background:#fff;color:var(--ink);border-radius:40px;padding:8px 16px 8px 12px;font-family:var(--fun);font-size:28px;font-weight:600;display:flex;align-items:center;
  transition:transform .25s}
.kstars .s{font-size:28px;margin-right:6px}
.kstars.bump{transform:scale(1.25)}
.pbar{height:12px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .5s}
.kbody{padding:14px;flex:1}
.sect{font-family:var(--fun);font-weight:600;font-size:18px;color:#4b5563;margin:4px 4px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.tile{position:relative;border-radius:20px;padding:14px 10px 12px;text-align:center;background:#f6f6fa;border:3px solid #ececf3;transition:transform .15s,background .3s}
.tile:active{transform:scale(.94)}
.tile .ic{font-size:46px;line-height:1.1;display:block}
.tile .nm{font-weight:800;font-size:16px;margin-top:6px;line-height:1.2;min-height:38px;display:flex;align-items:center;justify-content:center}
.tile .val{display:inline-block;margin-top:6px;font-weight:800;font-size:14px;background:#fff;border-radius:20px;padding:3px 10px}
.tile.done{color:#fff}
.tile.done .val{color:var(--ink)}
.tile.done .ic{animation:pop .45s}
.tile .tick{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;background:var(--good);color:#fff;font-size:20px;line-height:34px;font-weight:800;
  border:3px solid #fff;display:none}
.tile.done .tick{display:block}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-10deg)}100%{transform:scale(1)}}
.alldone{border-radius:18px;padding:14px;text-align:center;font-family:var(--fun);font-size:22px;font-weight:600;margin-bottom:14px;color:#14532d;background:#dcfce7;animation:pop .6s}
.flystar{position:fixed;font-size:34px;z-index:60;pointer-events:none;transition:transform .75s cubic-bezier(.5,-.3,.6,1),opacity .75s}

/* ---------- Rewards ---------- */
.rewards{height:100%;overflow:auto;padding:16px;background:linear-gradient(160deg,#fdf4ff,#fff7ed 60%,#ecfeff)}
.rkid{background:#fff;border-radius:24px;padding:16px 18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(30,42,74,.08)}
.rhead{display:flex;align-items:center;margin-bottom:12px}
.rhead .avatar{width:52px;height:52px;line-height:52px;font-size:30px}
.rhead .kname{font-size:26px;color:var(--ink)}
.rhead .kstars{box-shadow:0 0 0 2px #f3e8c8}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.rcard{border-radius:20px;padding:14px;text-align:center;background:#fafaf7;border:2px solid #efece4}
.rcard .ic{font-size:44px}
.rcard .nm{font-weight:800;font-size:16px;min-height:40px;margin-top:4px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.rcard .cost{font-family:var(--fun);font-size:20px;font-weight:600;margin:4px 0}
.rbar{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin:6px 0 10px}
.rbar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:10px}
.rcard.can{border-color:#fbbf24;background:#fffbeb;animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(251,191,36,.25)}}
.rcard .btn{width:100%}
.hist{margin-top:12px;font-size:14px;color:var(--muted)}
.hist div{padding:3px 0}

/* ---------- Parents ---------- */
.parents{height:100%;display:flex}
.pnav{width:210px;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
.pnav button{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:12px;font-weight:800;font-size:16px;margin-bottom:4px;color:#4b5563}
.pnav button.on{background:var(--navy);color:#fff}
.pbody{flex:1;overflow-y:auto;padding:18px 22px}
.pbody h2{font-family:var(--fun);font-weight:600;margin:0 0 4px;font-size:26px}
.pbody .hint{color:var(--muted);margin:0 0 14px}
.prow{display:flex;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px}
.prow>*+*{margin-left:12px}
.prow .ic{font-size:30px;width:40px;text-align:center}
.prow .grow{flex:1;min-width:0}
.prow .t{font-weight:800;font-size:16px}
.prow .s{color:var(--muted);font-size:14px}
.swatch{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle}
.pgroup{margin-bottom:22px}
.pgroup h3{display:flex;align-items:center;margin:0 0 8px;font-size:18px}
.pgroup h3 .btn{margin-left:auto}

/* ---------- Modal / forms ---------- */
#modal{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:22px;width:560px;max-width:100%;max-height:100%;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet h2{font-family:var(--fun);font-weight:600;font-size:24px;margin:0 0 14px}
.fld{margin-bottom:14px}
.fld label{display:block;font-weight:800;font-size:14px;color:#4b5563;margin-bottom:6px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input[type=password],.fld select,.fld textarea{
  width:100%;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:12px;font-family:inherit;background:#fff;color:var(--ink)}
.fld textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:inline-flex;align-items:center;font-weight:700;font-size:16px}
.chk input{width:22px;height:22px;margin-right:8px}
.pills{display:flex;flex-wrap:wrap}
.pill{padding:9px 14px;border-radius:30px;border:2px solid var(--line);font-weight:800;font-size:15px;margin:0 6px 6px 0;background:#fff}
.pill.on{color:#fff;border-color:transparent}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:150px;overflow-y:auto;background:#f7f7f9;border-radius:12px;padding:6px;margin-top:8px}
.emojis button{font-size:26px;height:44px;border-radius:10px}
.emojis button:active{background:#e5e7eb}
.eminput{display:flex;align-items:center}
.eminput .prev{font-size:40px;width:60px;text-align:center}
.eminput input{flex:1}
.actions{display:flex;margin-top:18px}
.actions>*+*{margin-left:10px}
.actions .sp{flex:1}
.detail p{margin:6px 0;font-size:17px}
.detail .lbl{color:var(--muted);font-weight:700;width:70px;display:inline-block}
/* pin */
.pin{text-align:center}
.dots{display:flex;justify-content:center;margin:6px 0 16px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--navy);margin:0 8px}
.dots i.f{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center}
.pad button{height:72px;border-radius:18px;background:#f1f3f8;font-size:28px;font-weight:800}
.pad button:active{background:#dde2ee}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* celebration */
.celebrate{text-align:center;padding:10px}
.celebrate .ic{font-size:96px;animation:pop .8s}
.celebrate h2{font-size:32px;margin:6px 0}
#fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:70}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:14px 22px;border-radius:40px;
  font-weight:800;font-size:17px;z-index:80;transition:transform .35s;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

/* smaller screens / portrait */
@media (max-width:900px){
  #tabs button{font-size:16px;padding:10px 14px;margin:0 3px}
  .clock{min-width:120px} #clkTime{font-size:24px}
  .side{display:none}
  .calTitle{min-width:0;font-size:20px}
  .seg button{padding:8px 10px;font-size:13px}
  .pnav{width:150px}
}
@media (max-width:600px){
  #clkDate{display:none} .clock{min-width:70px}
  #tabs button{font-size:14px;padding:8px 9px}
  .toolbar{flex-wrap:wrap}
  .seg{margin-left:0!important;margin-top:8px;width:100%}
}
</style>
</head>
<body>
<header id="top">
  <div class="clock"><div id="clkTime"></div><div id="clkDate"></div></div>
  <nav id="tabs">
    <button data-act="tab" data-tab="cal">📅 Calendar</button>
    <button data-act="tab" data-tab="chores">⭐ Chores</button>
    <button data-act="tab" data-tab="rewards">🎁 Rewards</button>
  </nav>
  <button class="gstat hidden" id="gstat" data-act="gstat" aria-label="Google sync"></button>
  <button class="gear" data-act="parents" aria-label="Parents">⚙️</button>
</header>
<main id="main"></main>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<canvas id="fx"></canvas>
<div id="toast"></div>

/* ---- chores / stars / rewards sync through the Google Sheet ---- */
function shared(){ var o={}; SH_KEYS.forEach(function(k){ o[k]=S.settings[k]; }); return o; }
function snap(){ return {members:JSON.stringify(S.members),chores:JSON.stringify(S.chores),rewards:JSON.stringify(S.rewards),settings:JSON.stringify(shared()),log:S.log.map(function(l){return l.id;})}; }
function idSet(a){ var o={}; a.forEach(function(id){ o[id]=1; }); return o; }
function baseFrom(d){ var o={members:JSON.stringify(d.members),chores:JSON.stringify(d.chores),rewards:JSON.stringify(d.rewards),log:d.log.map(function(l){return l.id;})}, s={};
  SH_KEYS.forEach(function(k){ s[k]=d.settings[k]!==undefined?d.settings[k]:S.settings[k]; }); o.settings=JSON.stringify(s); return o; }
function scheduleSync(){ if(!G||!gOn()) return; clearTimeout(G.t); G.t=setTimeout(function(){ syncNow(true); },1200); }
function fullChanges(){ return {members:S.members,chores:S.chores,rewards:S.rewards,settings:shared(),logReplace:S.log}; }
function syncNow(quiet,forced){
  if(!gOn()) return Promise.resolve();
  if(G.syncing){ G.again=true; return Promise.resolve(); }
  var L=snap(), B=G.base, ch={}, n=0;
  if(forced){ ch=forced; n=1; }
  else if(B){
    ['members','chores','rewards'].forEach(function(t){ if(L[t]!==B[t]){ ch[t]=S[t]; n++; } });
    if(L.settings!==B.settings){ ch.settings=shared(); n++; }
    var bs=idSet(B.log), ls=idSet(L.log);
    var add=S.log.filter(function(l){return !bs[l.id];}), del=B.log.filter(function(id){return !ls[id];});
    if(add.length){ ch.logAdd=add; n++; } if(del.length){ ch.logDel=del; n++; }
  }
  G.syncing=true; gStatus('busy');
  return api('sync',{changes:ch, rev:(B&&!n)?G.cfg.rev:null}).then(function(j){
    G.syncing=false; var d=j.data;
    if(d.same){ gStatus('ok'); return; }
    if(!B&&!forced){ // first time this device joins
      if(d.empty){ return syncNow(quiet,fullChanges()); }
      if(S.log.length){ askJoin(d); gStatus('ok'); return; }
    }
    applyRemote(d,L); gStatus('ok');
  }).catch(function(e){ G.syncing=false; gStatus('bad',e.message); if(!quiet) toast('⚠️ '+e.message); })
  .then(function(){ if(G.again){ G.again=false; return syncNow(true); } });
}
function applyRemote(d,L){
  var N=snap(), changed=false;
  ['members','chores','rewards'].forEach(function(t){ if(N[t]===L[t]&&JSON.stringify(d[t])!==N[t]){ S[t]=d[t]; changed=true; } });
  if(N.settings===L.settings) SH_KEYS.forEach(function(k){ if(d.settings[k]!==undefined&&d.settings[k]!==S.settings[k]){ S.settings[k]=d.settings[k]; changed=true; } });
  var ls=idSet(L.log), ns=idSet(N.log), rs=idSet(d.log.map(function(l){return l.id;}));
  var added=S.log.filter(function(l){ return !ls[l.id]&&!rs[l.id]; }), gone=idSet(L.log.filter(function(id){ return !ns[id]; }));
  var log=d.log.filter(function(l){ return !gone[l.id]; }).concat(added);
  if(JSON.stringify(log.map(function(l){return l.id;}))!==JSON.stringify(N.log)) changed=true;
  S.log=log;
  G.base=baseFrom(d); lsSet(GBASE,G.base); G.cfg.rev=d.rev; lsSet(GKEY,G.cfg); saveLocal();
  if(changed) safeRender();
  if(dirty()) scheduleSync();
}
function dirty(){ var s=snap(),b=G.base; if(!b) return true; return s.members!==b.members||s.chores!==b.chores||s.rewards!==b.rewards||s.settings!==b.settings||s.log.join()!==b.log.join(); }
function askJoin(d){
  G.joinData=d;
  var kidsR=d.members.filter(function(m){return m.kid;}).map(function(m){ var t=0; d.log.forEach(function(l){ if(l.kid===m.id) t+=l.d; }); return m.emoji+' '+esc(m.name)+' '+t+' ⭐'; }).join(' · ');

    '<div class="gbox"><b>Shared (Google)</b><br>'+(kidsR||'—')+'</div><div class="gbox"><b>This device</b><br>'+(kidsL||'—')+'</div>'+

function qrSVG(text){

function toggleChore(id,key,el){

  S.log.push({id:uid(),kid:c.kidId,d:c.stars,why:c.icon+' '+c.name,choreId:id,key:key,at:Date.now()});
  var big=false;

  } else if(key.charAt(0)!=='W'){
    var dl=dailyFor(c.kidId,pd(key)); big=dl.every(function(x){return isDone(x.id,key);});
  }
  save(); render();
  var tgt=$('star-'+c.kidId);
  chime(big);
  flyStars(rect,tgt,c.stars);
  confetti(rect.left+rect.width/2,rect.top+rect.height/2,big?160:40,big);
  var k=member(c.kidId);
  if(big) toast('🎉 Woohoo '+(k?k.name:'')+'! All today’s chores done!');
}
function flyStars(r,tgt,n){
  if(!tgt) return; var t=tgt.getBoundingClientRect(); var cx=r.left+r.width/2-17, cy=r.top+r.height/2-17;
  var count=Math.min(n,5);
  for(var i=0;i<count;i++)(function(i){
    var s=document.createElement('span'); s.className='flystar'; s.textContent='⭐'; s.style.left=cx+'px'; s.style.top=cy+'px';
    document.body.appendChild(s);
    setTimeout(function(){ s.style.transform='translate('+(t.left+10-cx)+'px,'+(t.top+4-cy)+'px) scale(.7) rotate(200deg)'; },30+i*110);
    setTimeout(function(){ s.parentNode&&s.parentNode.removeChild(s); tgt.classList.add('bump'); setTimeout(function(){tgt.classList.remove('bump');},250); },830+i*110);
  })(i);
}

function daysLabel(days){
  if(!days||days.length===7) return 'Every day';
  var s=days.slice().sort().join(',');

  if(s==='0,6') return 'Weekends';
  return days.slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7);}).map(function(d){return DSH[d];}).join(', ');
}

/* =================== Effects =================== */
var AC=null;
function chime(big){
  if(!S.settings.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var notes=big?[523,659,784,1047,1319]:[784,1175], t0=AC.currentTime;
    notes.forEach(function(f,i){ var o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+i*.09); g.gain.linearRampToValueAtTime(.18,t0+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001,t0+i*.09+.4);
      o.connect(g); g.connect(AC.destination); o.start(t0+i*.09); o.stop(t0+i*.09+.45); });
  }catch(e){}
}
var cv=$('fx'), cx=cv.getContext('2d'), parts=[], running=false;
function sizeFx(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
window.addEventListener('resize',sizeFx); sizeFx();
function confetti(x,y,n,wide){
  var cols=['#f97316','#fbbf24','#22c55e','#3b82f6','#ec4899','#8b5cf6','#06b6d4'];
  for(var i=0;i<n;i++){
    var a=wide?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*2.2, sp=(wide?6:4)+Math.random()*(wide?9:6);
    parts.push({x:wide?window.innerWidth*Math.random():x,y:wide?-10-Math.random()*window.innerHeight*.3:y,vx:Math.cos(a)*sp*(wide?.4:1),vy:wide?Math.random()*3+2:Math.sin(a)*sp,
      r:4+Math.random()*5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:wide?160:70,star:Math.random()<.25});
  }
  if(!running){ running=true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.22; p.vx*=.99; p.rot+=p.vr; p.life--;
    if(p.life<=0||p.y>cv.height+20){ parts.splice(i,1); continue; }
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=Math.min(1,p.life/30); cx.fillStyle=p.c;
    if(p.star){ cx.font=(p.r*3)+'px sans-serif'; cx.fillText('⭐',-p.r,p.r); } else cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
    cx.restore(); }
  if(parts.length) requestAnimationFrame(tick); else { running=false; cx.clearRect(0,0,cv.width,cv.height); }
}

  if(id==='s_file'){ var f=ev.target.files[0]; if(!f) return; var r=new FileReader();
    r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d.members||!d.settings) throw 0;
      confirmBox('Replace everything on this tablet with the backup?','Restore',function(){ S=d; save(); render(); toast('✅ Restored'); },true);
    }catch(e){ toast('That file isn’t a Family Hub backup'); } }; r.readAsText(f); }
});
document.addEventListener('input',function(ev){ var id=ev.target.id; if(id==='f_emoji'||id==='f_icon'){ var p=$(id+'_p'); if(p) p.textContent=ev.target.value; } });

/* =================== Clock, idle, day rollover =================== */
function tickClock(){
  var n=new Date(), h=n.getHours(), m=n.getMinutes();
  $('clkTime').textContent=(h%12||12)+':'+pad(m)+' '+(h<12?'am':'pm');
  $('clkDate').textContent=fmtLong(n);
  var t=ds(today());
  if(t!==M.lastDay){ M.lastDay=t; if(M.tab!=='parents'&&$('modal').classList.contains('hidden')){ M.cur=today(); M.sel=today(); render(); } }
}
var idleT=null;
function resetIdle(){
  clearTimeout(idleT); var mins=+S.settings.idleMin; if(!mins) return;
  idleT=setTimeout(function(){ closeModal(); M.unlockUntil=0; M.tab=S.settings.home; M.view='month'; M.cur=today(); M.sel=today(); render(); },mins*60000);
}
['pointerdown','touchstart','keydown'].forEach(function(e){ document.addEventListener(e,resetIdle,{passive:true}); });

tickClock(); setInterval(tickClock,10000); resetIdle(); render();
/* Google: connect link, first sync, then keep checking */
(function(){
  function fromLink(){
    var m=location.hash.match(/^#connect=(.+)$/), f=location.hash.match(/^#fh=([\w-]+)~(\w+)~(.+)$/); if(!m&&!f) return false;
    try{ var c=f?{u:'https://script.google.com/macros/s/'+f[1]+'/exec',k:f[2],c:decodeURIComponent(f[3])}:JSON.parse(decodeURIComponent(escape(atob(m[1]))));
      history.replaceState(null,'',location.href.split('#')[0]); if(c.u&&c.k) gConnect(c.u,c.k,c.c); }catch(e){ toast('That connect link didn’t work'); }
    return true; }
  if(!fromLink()&&gOn()){ gStatus('ok'); syncNow(true); calRefresh(true); }
  window.addEventListener('hashchange',fromLink);
  setInterval(function(){ if(document.hidden||!gOn()) return; syncNow(true); if(Date.now()-G.lastCal>4*60000) calRefresh(true); },60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&gOn()){ syncNow(true); if(Date.now()-G.lastCal>60000) calRefresh(true); } });
})();
try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js'); }catch(e){}
setTimeout(function(){ if(bdaysOn(today()).length){ confetti(0,0,140,true); chime(true); } },600);
})();
