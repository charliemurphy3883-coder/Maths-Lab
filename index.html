<!doctype html>
<html lang="en-AU">
<head>

<style>
/* Layout: a bright arcade-style maths lab. Gradient sky, chunky white cards, Bolt the robot as guide.
   Deliberately single (bright) theme for a kids' app. */
:root{
  --sky1:#5b5bf7; --sky2:#b44cf0; --sky3:#ff6fa8;
  --card:#ffffff; --ink:#24164f; --muted:#6b5f95; --line:#e5defa; --soft:#f3efff;
  --blue:#2f6bff; --pink:#ff4fa3; --yellow:#ffc93c; --green:#1fc46b; --orange:#ff8a3d; --purple:#8b5cf6; --teal:#12c2c9; --red:#ff5a5f;
  --good:#16b364; --bad:#ff5a5f;
  --font:"Fredoka",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --r:24px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed;color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.35;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:940px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:16px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance;font-weight:700}
h1{font-size:2.3rem} h2{font-size:1.5rem} h3{font-size:1.2rem}
.white{color:#fff}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 8px 0 rgba(36,22,79,.12)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{background:var(--soft);border-radius:16px;padding:12px 18px;font-weight:700;min-height:52px;box-shadow:0 4px 0 rgba(36,22,79,.15);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(36,22,79,.15)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 #1d47c2}
.btn.green{background:var(--green);color:#fff;box-shadow:0 5px 0 #11904c}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #c92c7a}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 #d9a514}
.btn.orange{background:var(--orange);color:#fff;box-shadow:0 5px 0 #d1631b}
.btn.purple{background:var(--purple);color:#fff;box-shadow:0 5px 0 #6236c9}
.btn.big{font-size:1.4rem;padding:16px 28px;min-height:66px;border-radius:20px}
.btn:disabled{opacity:.45}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 14px;font-weight:700;font-size:.9rem;background:var(--soft)}
.chip.y1{background:#fff2c4;color:#8a5a00} .chip.y2{background:#dbe6ff;color:#1d47c2} .chip.y3{background:#d4f8e4;color:#0f7a43}
.hud .chip{font-size:1.05rem;padding:8px 16px;background:rgba(255,255,255,.95)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
/* hero */
.hero{display:flex;align-items:center;gap:16px}
.hero .mascot{width:120px;height:120px;flex:none;cursor:pointer}
.bubble{position:relative;background:#fff;border-radius:20px;padding:12px 16px;font-weight:600;box-shadow:0 6px 0 rgba(36,22,79,.12);max-width:520px}
.bubble::before{content:"";position:absolute;left:-12px;top:24px;border:8px solid transparent;border-right:12px solid #fff}
.mission{background:linear-gradient(135deg,#ffd84d,#ff9f43);color:var(--ink)}
.ring{width:110px;height:110px;flex:none}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:rgba(255,255,255,.5)} .ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-weight:700;font-size:22px;font-family:var(--font)}
.stars{display:flex;gap:4px}
.star{width:32px;height:32px}
.week{display:flex;gap:6px;flex-wrap:wrap}
.week span{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.week span.on{background:var(--orange);color:#fff}
.week span.today{outline:3px solid var(--purple);outline-offset:1px}
.bar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.skillrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed var(--line)}
.skillrow:first-child{border-top:0}
.skillrow .dot{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.2rem}
.skillrow .grow{flex:1;min-width:0;display:grid;gap:6px}
@media (max-width:560px){.skillrow{flex-wrap:wrap}.skillrow .grow{flex-basis:calc(100% - 60px)}.skillrow .chip{margin-left:56px}}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;gap:6px;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));z-index:5;box-shadow:0 -6px 20px rgba(36,22,79,.15)}
.tabs button{flex:1;max-width:190px;display:grid;justify-items:center;gap:2px;padding:6px;border-radius:16px;font-size:.9rem;font-weight:700;color:var(--muted)}
.tabs button svg{width:30px;height:30px}
.tabs button[aria-current="page"]{color:#fff;background:var(--purple)}
/* question screen */
.qscreen{position:fixed;inset:0;z-index:10;overflow:auto;background:linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 60%,var(--sky3) 100%);padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.qwrap{max-width:960px;margin:0 auto;display:grid;gap:12px}
.qtop{display:flex;align-items:center;gap:10px}
.round{width:50px;height:50px;border-radius:50%;background:#fff;font-size:1.4rem;font-weight:700;flex:none;display:grid;place-items:center;box-shadow:0 4px 0 rgba(36,22,79,.18)}
.round svg{width:26px;height:26px}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.35)}
.prog i.ok{background:var(--green)} .prog i.no{background:var(--red)} .prog i.cur{background:#fff}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:#fff;border-radius:16px;padding:8px 12px;min-width:80px;text-align:center;box-shadow:0 4px 0 rgba(36,22,79,.18)}
.timer.over{color:var(--red)}
.qbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.qbody{grid-template-columns:minmax(0,1fr)}}
.qcard{position:relative}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qhead .mascot{width:76px;height:76px;flex:none}
.prompt{font-size:1.6rem;font-weight:600;line-height:1.3;flex:1;min-width:0}
.prompt b{color:var(--purple)}
.nw{white-space:nowrap}
.speak{background:var(--teal);color:#fff;border-radius:16px;padding:8px 14px;font-weight:700;box-shadow:0 4px 0 #0b8f95;display:inline-flex;gap:6px;align-items:center}
.speak svg{width:22px;height:22px}
.diagram{display:flex;justify-content:center}
.diagram svg{max-width:100%;height:auto}
.answer{display:flex;align-items:center;gap:10px;background:#fff;border:4px solid #fff;border-radius:20px;padding:10px 18px;min-height:76px;font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 6px 0 rgba(36,22,79,.15)}
.answer.focus{border-color:var(--yellow)}
.answer .val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.answer .ph{color:#b3a9d6;font-size:1.2rem;font-weight:600}
.answer .unit{color:var(--muted);font-size:1.4rem}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.keypad button{background:#fff;border-radius:18px;min-height:66px;font-size:1.9rem;font-weight:700;box-shadow:0 5px 0 rgba(36,22,79,.18)}
.keypad button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(36,22,79,.18)}
.keypad button.sym{background:#efe8ff;color:var(--purple)}
.keypad button.del{background:#ffe1e3;color:var(--red)}
.keypad .check{grid-column:span 2;background:var(--green);color:#fff;font-size:1.5rem;box-shadow:0 5px 0 #11904c}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choices button{border-radius:20px;min-height:84px;font-size:1.7rem;font-weight:700;color:#fff;box-shadow:0 6px 0 rgba(36,22,79,.25);border:4px solid transparent}
.choices button.sel{border-color:#fff;transform:scale(1.04)}
.helpbar{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.helpbar .btn{padding:10px 8px;font-size:1rem;min-height:58px;line-height:1.15}
.hints{display:grid;gap:8px}
.hint{background:#fff6d6;border-radius:16px;padding:10px 14px;font-size:1.1rem;border:2px solid var(--yellow)}
.steps{background:#eef4ff;border-radius:16px;padding:12px 16px;display:grid;gap:6px;border:2px solid #b9cdff}
.steps ol{margin:0;padding-left:24px;display:grid;gap:6px}
.fb{border-radius:18px;padding:14px 16px;display:grid;gap:6px;font-size:1.15rem}
.fb.good{background:#d9f9e7;border:3px solid var(--green)} .fb.bad{background:#ffe3e4;border:3px solid var(--red)} .fb.try{background:#fff3cf;border:3px solid var(--yellow)}
.fb h3{font-size:1.45rem}
.nudge{position:absolute;right:12px;top:12px;background:#fff;border:3px solid var(--purple);border-radius:20px;padding:10px 14px;display:grid;gap:8px;max-width:300px;z-index:2;box-shadow:0 8px 20px rgba(36,22,79,.25);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* overlays */
.tick{position:fixed;inset:0;display:grid;place-items:center;z-index:40;pointer-events:none}
.tick svg{width:min(52vw,320px);height:auto;animation:tickpop 1.1s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes tickpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.1) rotate(4deg);opacity:1}45%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05);opacity:0}}
.tick .path{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .45s .15s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:39}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--yellow);color:var(--ink);padding:12px 22px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;animation:pop2 .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop2{from{transform:translateX(-50%) scale(.5)}to{transform:translateX(-50%) scale(1)}}
.modal{position:fixed;inset:0;background:rgba(36,22,79,.55);z-index:30;display:grid;place-items:center;padding:16px}
.modal .card{max-width:580px;width:100%;max-height:86vh;overflow:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border-radius:20px;padding:14px;display:grid;justify-items:center;text-align:center;gap:6px;box-shadow:0 6px 0 rgba(36,22,79,.12)}
.badge svg{width:64px;height:64px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge small{color:var(--muted);font-size:.85rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tw{overflow-x:auto}
.code{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:90px;border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px;font-size:.8rem}
input[type=text],input[type=password]{border:2px solid var(--line);background:var(--soft);border-radius:14px;padding:10px 12px;width:100%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch{width:64px;height:36px;border-radius:999px;background:#d8d0f2;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{left:32px}
.lesson li{margin-bottom:8px}
.big-num{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.statcard{color:#fff;box-shadow:0 8px 0 rgba(36,22,79,.18)}
.statcard .muted{color:rgba(255,255,255,.85)}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.bob,.shake,.tick svg,.nudge,.toast{animation:none}.tick svg{opacity:1}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6M9 12h4"/></svg>Learn</button>
  <button data-tab="trophies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Trophies</button>
  <button data-tab="parents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>Grown-ups</button>
</nav>
<section class="qscreen" id="qscreen" hidden></section>
<canvas id="confetti" hidden></canvas>
<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  const M = window.MathsLab;
  const KEY = "coops-maths-lab-v1";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // keep every number (e.g. 10 000, 861 500, 3.75) on one line
  const nw = h => h.replace(/\d+(?:[\u202F\u2009 ]\d{3})+(?:\.\d+)?|\d[\d.,:/]*\d/g, m => `<span class="nw">${m}</span>`);
  const md = s => nw(esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"));
  const fmtSec = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  const COLORS = ["#2f6bff", "#ff4fa3", "#1fc46b", "#ff8a3d", "#8b5cf6", "#12c2c9", "#ffc93c", "#ff5a5f"];
  const STRAND_COL = { "Number": "#2f6bff", "Algebra": "#8b5cf6", "Measurement": "#ff8a3d", "Space": "#12c2c9", "Statistics": "#ff4fa3", "Working mathematically": "#1fc46b" };

  /* ---------- storage ---------- */
  let S = null;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 1) S = M.newState();
  M.SKILLS.forEach(s => { if (!S.skills[s.id]) S.skills[s.id] = { level: 2, mastery: 40, seen: 0, correct: 0, recent: [], lastSeen: null, levelUps: 0 }; });
  if (S.sound == null) S.sound = true;
  if (S.voice == null) S.voice = true;
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked */ } }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------- sound effects (made in code, no files) ---------- */
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === "suspended") ac.resume(); return ac; }
  function tone(freq, start, dur, type = "triangle", vol = 0.18) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const SFX = {
    tap: () => tone(880, 0, 0.06, "sine", 0.08),
    right: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.25, "triangle", 0.2)); tone(1568, 0.38, 0.35, "sine", 0.12); },
    wrong: () => { tone(330, 0, 0.18, "sawtooth", 0.07); tone(247, 0.16, 0.28, "sawtooth", 0.07); },
    hint: () => { tone(660, 0, 0.1, "sine", 0.1); tone(990, 0.08, 0.15, "sine", 0.1); },
    level: () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.08, 0.3, "square", 0.07)); },
    finish: () => { [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, "triangle", 0.2)); },
  };
  const sfx = name => { if (S.sound) try { SFX[name](); } catch (e) {} };

  /* ---------- read aloud ---------- */
  let voice = null;
  const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|hysterical|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
  function voiceScore(v) {
    const n = (v.name + " " + v.voiceURI).toLowerCase();
    let sc = 0;
    if (/premium/.test(n)) sc += 300; else if (/enhanced|neural|natural/.test(n)) sc += 200;
    if (/en[-_]au/i.test(v.lang)) sc += 60; else if (/en[-_]gb/i.test(v.lang)) sc += 40; else if (/en[-_](nz|ie)/i.test(v.lang)) sc += 35; else if (/en[-_]us/i.test(v.lang)) sc += 30;
    if (/karen|lee|catherine|matilda|serena|daniel|kate|ava|zoe|evan|samantha/.test(n)) sc += 10;
    return sc;
  }
  function englishVoices() {
    if (!("speechSynthesis" in window)) return [];
    return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a, b) => voiceScore(b) - voiceScore(a));
  }
  function pickVoice() {
    const vs = englishVoices();
    voice = S.voiceName === "__system" ? null : (S.voiceName && vs.find(v => v.name === S.voiceName)) || vs[0] || null;
  }
  function speechText(s) {
    return String(s).replace(/\*\*/g, "").replace(/[  ]/g, "")
      .replace(/☐/g, " the box ")
      .replace(/(\d+) (\d+)\/(\d+)/g, "$1 and $2 over $3")

        <label class="muted">Daily problems: <b id="dcLabel">${S.dailyCount}</b><input type="range" id="setCount" min="10" max="20" value="${S.dailyCount}" style="width:100%"></label>
        <div class="row"><span class="muted">Set every skill to:</span>${[1, 2, 3].map(l => `<button class="btn" data-setlevel="${l}">${M.YEAR[l]}</button>`).join("")}</div>
        <label class="muted">Grown-ups PIN (blank = none)<input type="password" inputmode="numeric" id="setPin" maxlength="8" value="${esc(S.pin || "")}"></label>
        <div class="row"><button class="btn blue" id="saveSet">Save settings</button><span class="muted" id="setMsg"></span></div>
      </section>
      <section class="card"><h3>Backup</h3>
        <p class="muted" style="margin:0">Progress is saved on this iPad only. Copy the backup code now and then (paste it into Notes or an email). To move to another device, paste it below and press Restore.</p>
        <div class="row"><button class="btn" id="mkBackup">Make backup code</button><button class="btn" id="cpBackup" hidden>Copy</button></div>
        <textarea id="backup" placeholder="Backup code appears here, or paste one to restore"></textarea>
        <div class="row"><button class="btn" id="restore">Restore from code</button><button class="btn" id="resetAll" style="color:var(--red)">Reset all progress</button><span class="muted" id="bkMsg"></span></div>
      </section>`;
    const sw = (id, k) => { const b = $(id); b.onclick = () => { S[k] = !S[k]; b.setAttribute("aria-checked", S[k]); save(); if (!S.voice) hush(); }; };
    sw("#tVoice", "voice"); sw("#tSound", "sound");
    const vp = $("#voicePick"), fillVoices = () => { const vs = englishVoices(); vp.innerHTML = `<option value="__system" ${S.voiceName === "__system" ? "selected" : ""}>iPad default voice (the one ticked in Settings)</option>` + (vs.length ? vs.map(v => `<option value="${esc(v.name)}" ${voice && v.name === voice.name ? "selected" : ""}>${esc(v.name)} (${esc(v.lang)})${/premium/i.test(v.name + v.voiceURI) ? " ★ Premium" : /enhanced/i.test(v.name + v.voiceURI) ? " ★ Enhanced" : ""}</option>`).join("") : ""); };
    fillVoices(); if ("speechSynthesis" in window) speechSynthesis.addEventListener("voiceschanged", fillVoices);
    vp.onchange = () => { S.voiceName = vp.value; save(); pickVoice(); say(`Hi ${S.name}! I'm your new voice. What is 3 times 4?`); };
    $("#testVoice").onclick = () => { audio(); sfx("right"); say(`Hi ${S.name}! Well done! What is 3 times 4?`); };
    $("#setCount").oninput = e => $("#dcLabel").textContent = e.target.value;
    $("#saveSet").onclick = () => { S.name = $("#setName").value.trim() || "Cooper"; S.dailyCount = +$("#setCount").value; S.pin = $("#setPin").value.trim() || null; save(); $("#setMsg").textContent = "Saved. The new daily count starts with tomorrow's mission."; };
    document.querySelectorAll("[data-setlevel]").forEach(b => b.onclick = () => { const l = +b.dataset.setlevel; M.SKILLS.forEach(s => { if (s.id !== "puzzle") { S.skills[s.id].level = l; S.skills[s.id].recent = []; } }); save(); renderParents(); toast(`All skills set to ${M.YEAR[l]}`); });
    const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
    $("#mkBackup").onclick = () => { $("#backup").value = enc(S); $("#cpBackup").hidden = false; $("#bkMsg").textContent = ""; };
    $("#cpBackup").onclick = () => { const t = $("#backup"); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => $("#bkMsg").textContent = "Copied.", () => { t.select(); $("#bkMsg").textContent = "Selected: press Copy."; }); };
    $("#restore").onclick = () => {
      let o; try { o = JSON.parse(decodeURIComponent(escape(atob($("#backup").value.trim())))); } catch (e) { o = null; }
      if (!o || o.v !== 1 || !o.skills) { $("#bkMsg").textContent = "That code doesn't look right. Check you copied all of it."; return; }
      modal(`<h3>Replace progress?</h3><p>This replaces everything on this device with the backup.</p><div class="row"><button class="btn blue" id="yes">Restore</button><button class="btn" data-close>Cancel</button></div>`, mm => mm.querySelector("#yes").onclick = () => { S = o; save(); mm.remove(); renderParents(); toast("Backup restored"); });
    };
    $("#resetAll").onclick = () => modal(`<h3>Reset all progress?</h3><p>Points, badges, streaks and levels go back to the start. This can't be undone unless you have a backup code.</p><div class="row"><button class="btn" style="background:var(--red);color:#fff" id="yes">Reset</button><button class="btn" data-close>Cancel</button></div>`, mm => mm.querySelector("#yes").onclick = () => { const keep = { name: S.name, pin: S.pin, dailyCount: S.dailyCount, sound: S.sound, voice: S.voice }; S = Object.assign(M.newState(keep.name), keep); save(); mm.remove(); renderParents(); toast("Progress reset"); });
  }

  /* ---------- diagrams ---------- */
  function diagram(d) {
    if (!d) return "";
    const T = (x, y, t, a = "middle", sz = 16) => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="${sz}" font-weight="700" fill="#24164f" font-family="Fredoka,ui-rounded,sans-serif">${esc(t)}</text>`;
    const stroke = `stroke="#8b5cf6" stroke-width="4" fill="#f3efff"`;
    let svg = "";
    if (d.k === "rect") {
      const sc = Math.min(240 / d.w, 140 / d.h), w = d.w * sc, h = d.h * sc;
      svg = `<svg viewBox="0 0 ${w + 100} ${h + 50}" width="${w + 100}"><rect x="20" y="10" width="${w}" height="${h}" rx="4" ${stroke}/>${T(20 + w / 2, h + 38, d.wl)}${T(w + 30, 10 + h / 2 + 5, d.hl, "start")}</svg>`;
    } else if (d.k === "tri") {
      const sc = Math.min(240 / d.b, 140 / d.h), b = d.b * sc, h = d.h * sc, apx = 20 + b * 0.35;
      svg = `<svg viewBox="0 0 ${b + 110} ${h + 50}" width="${b + 110}"><polygon points="20,${h + 10} ${20 + b},${h + 10} ${apx},10" ${stroke}/><line x1="${apx}" y1="10" x2="${apx}" y2="${h + 10}" stroke="#ff4fa3" stroke-dasharray="6 5" stroke-width="3"/><rect x="${apx}" y="${h}" width="10" height="10" fill="none" stroke="#24164f"/>${T(20 + b / 2, h + 38, d.bl)}${T(apx + 10, 10 + h / 2, d.hl, "start")}</svg>`;
    } else if (d.k === "lshape") {
      const sc = Math.min(240 / d.W, 150 / d.H), W = d.W * sc, H = d.H * sc, cw = d.cw * sc, ch = d.ch * sc, x0 = 64, y0 = 14;
      svg = `<svg viewBox="0 0 ${W + 140} ${H + 56}" width="${W + 140}"><polygon points="${x0},${y0} ${x0 + W - cw},${y0} ${x0 + W - cw},${y0 + ch} ${x0 + W},${y0 + ch} ${x0 + W},${y0 + H} ${x0},${y0 + H}" ${stroke}/><rect x="${x0 + W - cw}" y="${y0}" width="${cw}" height="${ch}" fill="none" stroke="#b3a9d6" stroke-dasharray="5 5" stroke-width="2"/>${T(x0 + W / 2, y0 + H + 28, d.W + " cm")}${T(x0 - 8, y0 + H / 2 + 5, d.H + " cm", "end")}${T(x0 + W - cw / 2, y0 + ch + 22, d.cw + " cm", "middle", 14)}${T(x0 + W - cw - 6, y0 + ch / 2 + 5, d.ch + " cm", "end", 14)}</svg>`;
    } else if (d.k === "line") {
      const a = d.a * Math.PI / 180, cx = 160, cy = 125, L = 115, ex = cx + L * Math.cos(a), ey = cy - L * Math.sin(a), m1 = a / 2, m2 = (a + Math.PI) / 2;
      svg = `<svg viewBox="0 0 320 155" width="320"><line x1="30" y1="${cy}" x2="290" y2="${cy}" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>${T(cx + 52 * Math.cos(m1), cy - 52 * Math.sin(m1) + 6, d.a + "°")}${T(cx + 52 * Math.cos(m2), cy - 52 * Math.sin(m2) + 6, d.x)}</svg>`;
    } else if (d.k === "point") {
      const cx = 150, cy = 115, L = 100, angs = [0, d.a, d.a + d.b].map(x => x * Math.PI / 180);
      const lab = [[d.a, d.a + "°"], [d.b, d.b + "°"], [360 - d.a - d.b, d.x]]; let acc = 0;
      svg = `<svg viewBox="0 0 300 230" width="300">${angs.map(t => `<line x1="${cx}" y1="${cy}" x2="${cx + L * Math.cos(t)}" y2="${cy - L * Math.sin(t)}" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>`).join("")}<circle cx="${cx}" cy="${cy}" r="5" fill="#24164f"/>${lab.map(([deg, t]) => { const m = (acc + deg / 2) * Math.PI / 180; acc += deg; return T(cx + 54 * Math.cos(m), cy - 54 * Math.sin(m) + 6, t); }).join("")}</svg>`;
    } else if (d.k === "triangle") {
      const P = [[30, 175], [280, 175], [125, 20]];
      const labs = d.top != null ? [d.a, d.b, d.top + "°"] : [d.a + "°", d.b + "°", d.x];
      const f = v => (typeof v === "number" ? v + "°" : v);
      svg = `<svg viewBox="0 0 310 205" width="310"><polygon points="${P.map(p => p.join(",")).join(" ")}" ${stroke} stroke-linejoin="round"/>${T(66, 164, f(labs[0]))}${T(240, 164, f(labs[1]))}${T(128, 62, f(labs[2]))}</svg>`;
    } else if (d.k === "prism") {
      const sc = Math.min(24, 170 / (d.l + d.w * 0.5), 130 / (d.h + d.w * 0.5)), l = d.l * sc, w = d.w * sc * 0.5, h = d.h * sc, x0 = 80, y0 = 18 + w;
      const front = `${x0},${y0} ${x0 + l},${y0} ${x0 + l},${y0 + h} ${x0},${y0 + h}`, top = `${x0},${y0} ${x0 + w},${y0 - w} ${x0 + l + w},${y0 - w} ${x0 + l},${y0}`, side = `${x0 + l},${y0} ${x0 + l + w},${y0 - w} ${x0 + l + w},${y0 + h - w} ${x0 + l},${y0 + h}`;
      let grid = "";
      if (d.cubes) {
        const ln = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8b5cf6" opacity=".6"/>`;
        for (let i = 1; i < d.l; i++) grid += ln(x0 + i * sc, y0, x0 + i * sc, y0 + h) + ln(x0 + i * sc, y0, x0 + i * sc + w, y0 - w);
        for (let j = 1; j < d.h; j++) grid += ln(x0, y0 + j * sc, x0 + l, y0 + j * sc) + ln(x0 + l, y0 + j * sc, x0 + l + w, y0 + j * sc - w);
        for (let k = 1; k < d.w; k++) { const f = k / d.w; grid += ln(x0 + f * w, y0 - f * w, x0 + l + f * w, y0 - f * w) + ln(x0 + l + f * w, y0 - f * w, x0 + l + f * w, y0 + h - f * w); }
      }
      const W2 = x0 + l + w + 90, H2 = y0 + h + 40;
      svg = `<svg viewBox="0 0 ${W2} ${H2}" width="${W2}"><polygon points="${top}" fill="#c9b6ff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/><polygon points="${side}" fill="#a98bff" stroke="#8b5cf6" stroke-width="3" stroke-linejoin="round"/><polygon points="${front}" fill="#f3efff" stroke="#8b5cf6" stroke-width="4" stroke-linejoin="round"/>${grid}${d.ll ? T(x0 + l / 2, y0 + h + 28, d.ll) + T(x0 + l + w / 2 + 14, y0 + h - w / 2 + 18, d.wl, "start", 14) + T(x0 - 10, y0 + h / 2 + 6, d.hl, "end") : ""}</svg>`;
    } else if (d.k === "bag") {
      const cols = { red: "#ff5a5f", blue: "#2f6bff", green: "#1fc46b" }; const list = []; Object.entries(d.counts).forEach(([c, n]) => { for (let i = 0; i < n; i++) list.push(cols[c]); });
      const per = 8, rows = Math.ceil(list.length / per);
      svg = `<svg viewBox="0 0 ${per * 32 + 20} ${rows * 32 + 20}" width="${per * 32 + 20}">${list.map((c, i) => `<circle cx="${26 + (i % per) * 32}" cy="${26 + Math.floor(i / per) * 32}" r="13" fill="${c}" stroke="#24164f" stroke-width="2"/><circle cx="${22 + (i % per) * 32}" cy="${21 + Math.floor(i / per) * 32}" r="4" fill="#fff" opacity=".6"/>`).join("")}</svg>`;
    }
    return `<div class="diagram">${svg}</div>`;
  }

  /* ---------- QUESTION FLOW ---------- */
  let run = null, tick = null, cur = null;
  function startDaily() { const d = todayRec(true); if (d.done) return; run = { mode: "daily", qs: d.qs, i: d.i, day: d, results: d.results || [], pts: d.points, levelEvents: [], newBadges: [] }; openQ(); }
  function startPractice(skill) {
    const qs = [];
    for (let i = 0; i < 5; i++) { const id = skill || M.SKILLS[Math.floor(Math.random() * M.SKILLS.length)].id; qs.push(M.generate(id, S.skills[id].level)); }
    run = { mode: "practice", skill, qs, i: 0, results: [], pts: 0, levelEvents: [], newBadges: [], timeSec: 0, correct: 0 }; openQ();
  }
  function openQ() { audio(); $("#qscreen").hidden = false; document.body.style.overflow = "hidden"; newQuestion(); }
  function closeQ() { clearInterval(tick); hush(); $("#qscreen").hidden = true; document.body.style.overflow = ""; run = null; cur = null; save(); render(); }

  function newQuestion() {
    const q = run.qs[run.i];
    cur = { q, input: "", choice: null, help: 0, hintsShown: 0, tries: 1, t0: Date.now(), lastAct: Date.now(), nudges: 0, nudge: false, state: "ask", shown: false, mood: "happy" };
    drawQ();
    clearInterval(tick); tick = setInterval(onTick, 1000);
    if (S.voice) setTimeout(() => cur && cur.q === q && readQuestion(q), 350);
  }
  const secs = () => (Date.now() - cur.t0) / 1000;
  function onTick() {
    if (!cur) return;
    const el = $("#timer"); if (el) { const s = secs(); el.textContent = fmtSec(s); el.classList.toggle("over", s > cur.q.target); }
    // gentle nudge when he's been sitting on it
    if ((cur.state === "ask" || cur.state === "retry") && !cur.nudge && !cur.shown) {
      const idle = (Date.now() - cur.lastAct) / 1000;
      const wait = cur.nudges === 0 ? Math.max(25, cur.q.target * 0.6) : 45;
      if (idle > wait && cur.nudges < 2) { cur.nudge = true; cur.nudges++; cur.mood = "think"; drawQ(); sfx("hint"); say(cur.hintsShown < cur.q.hints.length ? rnd(["Do you need a hint?", "Stuck? Want a hint?", "Take your time. Would a hint help?"]) : "Want me to show you how?"); }
    }
  }
  const touch = () => { if (cur) cur.lastAct = Date.now(); };
  function drawQ() {
    const q = cur.q, sk = M.SKILL[q.skill], n = run.qs.length;
    const prog = run.qs.map((_, i) => `<i class="${i < run.results.length ? (run.results[i] ? "ok" : "no") : i === run.i ? "cur" : ""}"></i>`).join("");
    const isChoice = q.answer.t === "choice";
    const ph = q.answer.t === "frac" ? "type like 3/4" : q.answer.t === "time" ? "type like 14:30" : "type your answer";
    const answered = cur.state === "right" || cur.state === "wrong";
    const moreHints = cur.hintsShown < q.hints.length;
    $("#qscreen").innerHTML = `<div class="qwrap">
      <div class="qtop"><button class="round" id="qclose" aria-label="Save and exit">✕</button><div class="prog">${prog}</div><span class="timer" id="timer">${fmtSec(secs())}</span>
        <button class="round" id="mute" aria-label="${S.voice ? "Turn voice off" : "Turn voice on"}">${S.voice ? '<svg viewBox="0 0 24 24" fill="none" stroke="#24164f" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="#24164f" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'}</button></div>
      <div class="row between"><span class="chip" style="background:${STRAND_COL[sk.strand]};color:#fff">${sk.name}</span><span class="row" style="gap:8px">${yearChip(q.level)}<span class="chip">⭐ ${run.pts}</span><span class="chip">${run.i + 1} of ${n}</span></span></div>
      <div class="qbody">
        <section class="card qcard" id="qcard">
          ${cur.nudge ? `<div class="nudge" role="dialog"><b>${moreHints ? "Stuck? Want a hint?" : "Want me to show you how?"}</b><div class="row"><button class="btn yellow" id="nudgeYes">${moreHints ? "Yes, hint please" : "Show me"}</button><button class="btn" id="nudgeNo">I've got it</button></div></div>` : ""}
          <div class="qhead">${mascot(cur.mood)}<div class="prompt">${md(q.prompt)}</div></div>
          <div><button class="speak" id="readQ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Read it to me</button></div>
          ${diagram(q.diagram)}
          <div class="hints">${q.hints.slice(0, cur.hintsShown).map((h, i) => `<div class="hint"><b>💡 Hint ${i + 1}:</b> ${md(h)}</div>`).join("")}</div>
          ${cur.shown || answered ? `<div class="steps"><b>How to solve it</b><ol>${q.steps.map(s => `<li>${md(s)}</li>`).join("")}</ol></div>` : ""}
          ${feedbackHtml()}
        </section>
        <section style="display:grid;gap:12px;align-content:start">
          ${isChoice ? `<div class="choices">${q.answer.o.map((o, i) => `<button data-choice="${i}" class="${cur.choice === i ? "sel" : ""}" style="background:${COLORS[i % COLORS.length]}" ${answered ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>` :
            `<div class="answer ${answered ? "" : "focus"}" id="ansbox"><span class="val">${cur.input ? prettyInput(cur.input) : `<span class="ph">${ph}</span>`}</span>${q.unit ? `<span class="unit">${esc(q.unit)}</span>` : ""}</div>`}
          ${answered ? `<button class="btn ${cur.state === "right" ? "green" : "blue"} big" id="next">${run.i + 1 >= n ? "See my results 🏆" : "Next question ➜"}</button>` : `
            ${isChoice ? `<button class="btn green big" id="checkBtn" ${cur.choice == null ? "disabled" : ""}>Check ✓</button>` : `<div class="keypad">${["7", "8", "9", "⌫", "4", "5", "6", "/", "1", "2", "3", ":", "0", "."].map(k => `<button data-k="${k}" class="${k === "⌫" ? "del" : /[/:.]/.test(k) ? "sym" : ""}" aria-label="${k === "⌫" ? "Delete" : k}">${k}</button>`).join("")}<button class="check" id="checkBtn">Check ✓</button></div>`}
            <div class="helpbar">
              <button class="btn yellow" id="hintBtn" ${moreHints ? "" : "disabled"}>💡 Hint${moreHints ? ` ${cur.hintsShown + 1}/${q.hints.length}` : ""}</button>
              <button class="btn purple" id="methodBtn">📘 How does it work?</button>
              <button class="btn orange" id="showBtn" ${cur.shown ? "disabled" : ""}>👀 Show me</button>
            </div>`}
        </section>
      </div></div>`;
    $("#qclose").onclick = closeQ;
    $("#mute").onclick = () => { S.voice = !S.voice; save(); if (!S.voice) hush(); else readQuestion(q); drawQ(); };
    $("#readQ").onclick = () => { touch(); readQuestion(q); };
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => key(b.dataset.k));
    document.querySelectorAll("[data-choice]").forEach(b => b.onclick = () => { touch(); sfx("tap"); cur.choice = +b.dataset.choice; if (cur.state === "retry") cur.state = "ask"; cur.nudge = false; drawQ(); });
    const cb = $("#checkBtn"); if (cb) cb.onclick = submit;
    const nb = $("#next"); if (nb) nb.onclick = advance;
    const hb = $("#hintBtn"); if (hb) hb.onclick = showHint;
    const mb = $("#methodBtn"); if (mb) mb.onclick = () => { touch(); cur.help = Math.max(cur.help, 1); cur.nudge = false; say(M.LESSONS[q.skill].join(" ")); modal(`<div class="row" style="flex-wrap:nowrap;align-items:flex-start">${mascot("happy")}<div><h2>${sk.name}</h2><ul class="lesson">${M.LESSONS[q.skill].map(x => `<li>${md(x)}</li>`).join("")}</ul></div></div><button class="btn blue big" data-close>Back to the question</button>`, mm => mm.querySelectorAll(".mascot").forEach(s => { s.style.width = "70px"; s.style.height = "70px"; s.style.flex = "none"; })); };
    const sb = $("#showBtn"); if (sb) sb.onclick = showMe;
    const ny = $("#nudgeYes"); if (ny) ny.onclick = () => { cur.nudge = false; moreHints ? showHint() : showMe(); };
    const nn = $("#nudgeNo"); if (nn) nn.onclick = () => { cur.nudge = false; touch(); cur.mood = "happy"; hush(); say("You've got this!"); drawQ(); };
  }
  function showHint() { touch(); cur.nudge = false; cur.hintsShown++; cur.help = Math.max(cur.help, Math.min(2, cur.hintsShown)); cur.mood = "happy"; sfx("hint"); drawQ(); say("Hint: " + cur.q.hints[cur.hintsShown - 1]); }
  function showMe() { touch(); cur.nudge = false; cur.shown = true; cur.help = 3; drawQ(); say("Here's how. " + cur.q.steps.join(". ") + ". Now you type the answer."); }
  function feedbackHtml() {
    if (cur.state === "retry") return `<div class="fb try"><h3>Not quite. Try again! 💪</h3><span>Check your working, or tap 💡 Hint if you're stuck.</span></div>`;
    if (cur.state === "right") return `<div class="fb good"><h3>${cur.praise} +${cur.pts} points</h3>${cur.fast && cur.help === 0 ? `<span>⚡ Speed bonus: under ${fmtSec(cur.q.target)}!</span>` : ""}</div>`;
    if (cur.state === "wrong") return `<div class="fb bad"><h3>The answer is ${nw(esc(M.answerText(cur.q.answer)))}${cur.q.unit ? " " + esc(cur.q.unit) : ""}</h3><span>Good try! Read the steps above. You'll get it next time.</span></div>`;
    return "";
  }
  const PRAISE = ["Well done!", "Brilliant!", "Awesome!", "Nailed it!", "Spot on!", "Superstar!", "Legend!", "Too easy!", "Amazing!"];
  function key(k) {
    if (!cur || (cur.state !== "ask" && cur.state !== "retry")) return;
    touch(); sfx("tap");
    if (k === "⌫") cur.input = cur.input.slice(0, -1); else if (cur.input.length < 14) cur.input += k;
    if (cur.state === "retry") cur.state = "ask";
    if (cur.nudge) { cur.nudge = false; cur.mood = "happy"; drawQ(); return; }
    const v = $("#ansbox .val"); if (v) v.innerHTML = cur.input ? prettyInput(cur.input) : `<span class="ph">type your answer</span>`;
  }
  function submit() {
    const q = cur.q, val = q.answer.t === "choice" ? cur.choice : cur.input;
    if (val === "" || val == null) return;
    touch();
    const ok = M.check(q.answer, val);
    if (!ok && cur.tries === 1 && !cur.shown) {
      cur.tries = 2; cur.state = "retry"; cur.mood = "think"; cur.nudge = false;
      if (q.answer.t !== "choice") cur.input = "";
      sfx("wrong"); say(rnd(["Try again!", "Not quite. Try again!", "Ooh, close. Have another go!"]));
      drawQ();
      const box = $("#ansbox") || $(".choices"); if (box) { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
      return;
    }
    const s = secs();
    clearInterval(tick);
    const res = M.record(S, q, ok, cur.help, cur.tries, s);
    cur.pts = res.pts; cur.fast = res.fast; cur.state = ok ? "right" : "wrong"; cur.nudge = false;
    cur.praise = rnd(PRAISE); cur.mood = ok ? "wow" : "sad";
    run.results.push(ok ? 1 : 0); run.pts += res.pts;
    if (ok) { sfx("right"); bigTick(); confetti(); say(cur.praise + (cur.fast && cur.help === 0 ? " And super fast!" : "")); }
    else { sfx("wrong"); say(`Good try. The answer is ${M.answerText(q.answer)}${q.unit ? " " + q.unit : ""}. Let's look at how.`); }
    res.events.forEach(e => { if (e.type === "levelup") { run.levelEvents.push(e); setTimeout(() => { sfx("level"); toast(`⬆ Level up! ${M.SKILL[e.skill].name} is now ${M.YEAR[e.level]}`); }, 900); } });
    M.checkBadges(S).forEach(b => { run.newBadges.push(b); setTimeout(() => toast(`🏅 New badge: ${b.name}`), 1500); });
    if (run.mode === "daily") { const d = run.day; d.results = run.results; d.correct += ok ? 1 : 0; d.points += res.pts; d.timeSec += Math.round(s); if (cur.help > 0) d.helpUsed++; d.i = run.i + 1; }
    else { run.correct += ok ? 1 : 0; run.timeSec += s; }
    save(); drawQ();
  }
  function advance() {
    hush(); run.i++;
    if (run.i < run.qs.length) { newQuestion(); return; }
    clearInterval(tick);
    if (run.mode === "daily") { const d = run.day; d.done = true; run.newBadges.push(...M.finishDay(S, d)); save(); results(d.correct, d.total, d.timeSec, d.points, d.stars); }
    else results(run.correct, run.qs.length, run.timeSec, run.pts, null);
  }
  function results(correct, total, t, pts, stars) {
    const lv = run.levelEvents, bd = run.newBadges, daily = run.mode === "daily";
    const great = correct / total >= 0.7;
    $("#qscreen").innerHTML = `<div class="qwrap" style="max-width:660px">
      <section class="card" style="text-align:center;justify-items:center">
        ${mascot(great ? "wow" : "happy", "bob")}
        <h1>${daily ? "Mission complete!" : "Practice done!"}</h1>
        ${stars ? `<div class="stars" style="transform:scale(1.7);margin:12px 0">${[1, 2, 3].map(i => starSvg(i <= stars)).join("")}</div>` : ""}
        <div class="row" style="justify-content:center;gap:28px">
          <div><div class="big-num" style="color:var(--green)">${correct}/${total}</div><span class="muted">right</span></div>
          <div><div class="big-num" style="color:var(--blue)">${fmtSec(t)}</div><span class="muted">time</span></div>
          <div><div class="big-num" style="color:var(--orange)">+${pts}</div><span class="muted">points</span></div>
        </div>
        ${daily ? `<p style="margin:0;font-size:1.2rem">🔥 ${S.streak.count} day streak!</p>` : ""}
        ${lv.length ? `<div style="display:grid;gap:6px">${lv.map(e => `<span class="chip y${e.level}">⬆ ${M.SKILL[e.skill].name} → ${M.YEAR[e.level]}</span>`).join("")}</div>` : ""}
        ${bd.length ? `<div class="badges" style="width:100%">${bd.map(b => `<div class="badge">${badgeSvg(M.BADGES.indexOf(b))}<b>${b.name}</b><small>${b.desc}</small></div>`).join("")}</div>` : ""}
        <div class="row" style="justify-content:center"><button class="btn blue big" id="home">Back home</button>${!daily ? `<button class="btn pink big" id="again">Go again</button>` : ""}</div>
      </section></div>`;
    document.querySelectorAll("#qscreen .mascot").forEach(s => { s.style.width = "120px"; s.style.height = "120px"; });
    sfx("finish"); if (great) { confetti(220); setTimeout(() => confetti(160), 700); }
    say(`${daily ? "Mission complete!" : "Practice done!"} You got ${correct} out of ${total}. ${great ? "Awesome work!" : "Good effort. Keep practising and you'll level up!"}`);
    $("#home").onclick = closeQ;
    const ag = $("#again"); if (ag) { const sk = run.skill; ag.onclick = () => { hush(); startPractice(sk); }; }
  }
  document.addEventListener("keydown", e => {
    if ($("#qscreen").hidden || !cur || document.querySelector(".modal")) return;
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (/^[0-9./:]$/.test(e.key)) { key(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { key("⌫"); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); if (cur.state === "right" || cur.state === "wrong") advance(); else submit(); }
  });

  /* ---------- tabs ---------- */
  function render() {
    document.querySelectorAll("#tabs [data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    if (tab === "home") renderHome(); else if (tab === "learn") renderLearn(); else if (tab === "trophies") renderTrophies(); else renderParents();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll("#tabs [data-tab]").forEach(b => b.onclick = () => { audio(); sfx("tap"); tab = b.dataset.tab; if (tab !== "parents") parentsOpen = false; render(); });
  document.addEventListener("click", e => {
    const p = e.target.closest("[data-practise]"); if (p) { audio(); startPractice(p.dataset.practise); return; }
    const l = e.target.closest("[data-lesson]"); if (l) { openLesson(l.dataset.lesson); return; }
    const t = e.target.closest("[data-tab-go]"); if (t) { tab = t.dataset.tabGo; render(); }
  });
  if (!S.history.length && !S.seenIntro2) {
    S.seenIntro2 = true; save();
    setTimeout(() => modal(`<div class="row" style="flex-wrap:nowrap;align-items:flex-start">${mascot("wow", "bob")}<div><h2>Hi! I'm Bolt.</h2><p style="margin:6px 0 0">Welcome to the Maths Lab!</p></div></div><ul class="lesson"><li>Every day there's a <b>mission</b>: ${S.dailyCount} problems, plus brain-bending puzzles.</li><li>I'll read each question out loud. Tap <b>Read it to me</b> to hear it again.</li><li>Stuck? Tap <b>💡 Hint</b>. <b>📘 How does it work?</b> explains the method. <b>👀 Show me</b> walks you through it, but you get fewer points.</li><li>Get it right with no help, fast, for bonus points ⚡</li><li>Get lots right and you level up. Year 6+ is the top!</li></ul><button class="btn green big" data-close id="letsgo">Let's go! 🚀</button>`, mm => { mm.querySelectorAll(".mascot").forEach(s => { s.style.width = "90px"; s.style.height = "90px"; s.style.flex = "none"; }); mm.querySelector("#letsgo").addEventListener("click", () => { audio(); sfx("finish"); say(`Let's go, ${S.name}!`); }); }), 300);
  }
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
